name: Python CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


jobs:

  # ==========================================================
  # 1. CI - RUN ON GITHUB UBUNTU
  # ==========================================================
  test-python:
    name: CI - Python Test
    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Check Python syntax
        run: |
          python -m py_compile "Account Trnx.py"


  # ==========================================================
  # 2. CD - DEPLOY TO TEST
  # ==========================================================
  deploy-test:
    name: CD - Deploy to TEST

    needs: test-python

    # Deploy only when code is actually pushed to main.
    # Do NOT deploy Pull Requests to TEST.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: [self-hosted, Windows, X64]

    steps:

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Deploy to TEST
        shell: powershell
        run: |

          $source = $env:GITHUB_WORKSPACE

          $destination = "C:\Users\Administrator\Desktop\Zoho books\Zoho python code\Financial_DB_TEST"

          Write-Host "=========================================="
          Write-Host "DEPLOYING TO TEST"
          Write-Host "=========================================="

          Write-Host "Source:"
          Write-Host $source

          Write-Host "Destination:"
          Write-Host $destination

          # Create TEST folder if it does not exist
          if (!(Test-Path $destination)) {
              New-Item -ItemType Directory -Path $destination -Force
          }

          # Copy repository files to TEST
          Get-ChildItem -Path $source -Force |
              Where-Object { $_.Name -ne ".git" } |
              Copy-Item -Destination $destination -Recurse -Force

          Write-Host "=========================================="
          Write-Host "TEST DEPLOYMENT COMPLETED"
          Write-Host "=========================================="


  # ==========================================================
  # 3. CD - DEPLOY TO PRODUCTION
  # ==========================================================
  deploy-production:
    name: CD - Deploy to PROD

    needs: deploy-test

    # Connect this job to GitHub's production Environment.
    environment:
      name: production

    runs-on: [self-hosted, Windows, X64]

    steps:

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Deploy to PROD
        shell: powershell
        run: |

          $source = $env:GITHUB_WORKSPACE

          $destination = "C:\Users\Administrator\Desktop\Zoho books\Zoho python code\Financial_DB_PROD"

          Write-Host "=========================================="
          Write-Host "DEPLOYING TO PRODUCTION"
          Write-Host "=========================================="

          Write-Host "Source:"
          Write-Host $source

          Write-Host "Destination:"
          Write-Host $destination

          # Create PROD folder if it does not exist
          if (!(Test-Path $destination)) {
              New-Item -ItemType Directory -Path $destination -Force
          }

          # Copy repository files to PROD
          Get-ChildItem -Path $source -Force |
              Where-Object { $_.Name -ne ".git" } |
              Copy-Item -Destination $destination -Recurse -Force

          Write-Host "=========================================="
          Write-Host "PRODUCTION DEPLOYMENT COMPLETED"
          Write-Host "=========================================="